services:
  postgres:
    image: postgres:16-alpine
    container_name: pp-cafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pp_cafe_local
    ports:
      - "5433:5432"
    volumes:
      - pp_cafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pp_cafe_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Web-based Database Manager (เข้าดูตารางและข้อมูลผ่าน Browser ได้ที่ http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: pp-cafe-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pp_cafe_pgdata:
    name: pp_cafe_pgdata
